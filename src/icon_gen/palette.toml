# Colour palettes for composed ability icons. Each palette is a ramp of five colours,
# shadow to highlight, plus the words the prompt uses to ask for it. The picture is
# gradient-mapped onto the ramp (its brightness picks the colour), so every icon in a
# palette shares one colour scheme while keeping its own shading and detail; `blend`
# is the palette's share, the rest the model's own colour. The ramps are muted and
# dark on purpose: the look is antique engraving with a cosmic-horror mood. The frame's rim and glow take the
# ramp's middle stop.
#
# The first palette that applies to an ability wins:
#   1. the damage type its mechanics deal
#   2. whether its mechanics harm, heal or help
#   3. its spell tradition (arcane / divine / occult / primal)
#   4. its ability type
# Keys match the game's data spellings. RGB, 0-255.

blend = 0.55

